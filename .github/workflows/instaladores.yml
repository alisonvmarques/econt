name: Instaladores

# Gera e confere os instaladores. Quando uma versão é publicada na página Releases (tag
# v1.0.0, por exemplo), anexa os instaladores a ela e atualiza o site: a documentação e o
# repositório de pacotes do Ubuntu, de onde o ECont se atualiza junto com o sistema.
# Também pode ser rodado à mão, pelo botão "Run workflow", para testar antes de publicar.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: o AppImage feito num sistema mais antigo roda nos mais novos.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # As bibliotecas xcb entram no AppImage, para a janela abrir em qualquer Linux.
          # desktop-file-utils: o appimagetool confere o atalho do menu com ele.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 file desktop-file-utils \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-util1

      - name: appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Instalar o ECont e as ferramentas de empacotamento
        run: |
          python -m pip install --upgrade pip
          pip install ".[empacotar]"

      - name: A versão da tag é a versão do ECont
        if: github.event_name == 'release'
        shell: bash
        run: |
          versao=$(python -c "import econt; print(econt.__version__)")
          test "v$versao" = "${GITHUB_REF_NAME}" || {
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão $versao do ECont."; exit 1; }

      - name: Gerar o instalador
        run: python scripts/empacotar.py

      - name: Instalar o pacote .deb, como no Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/econt_*_amd64.deb

      - name: Instalar e abrir o ECont para conferir
        run: python scripts/empacotar.py verificar

      - uses: actions/upload-artifact@v4
        with:
          name: ECont-${{ runner.os }}
          path: |
            dist/ECont-*.exe
            dist/ECont-*.dmg
            dist/ECont-*.AppImage
            dist/econt_*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Anexar os instaladores à versão
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/ECont-* dist/econt_*.deb --clobber

  site:
    # Documentação e repositório de pacotes, publicados no GitHub Pages.
    if: github.event_name == 'release'
    needs: instalador
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ECont-Linux
          path: dist

      - name: Montar a documentação
        run: |
          pip install mkdocs
          mkdocs build --strict --site-dir site

      - name: Montar o repositório de pacotes, assinado
        env:
          CHAVE: ${{ secrets.APT_CHAVE_PRIVADA }}
        run: |
          test -n "$CHAVE" || { echo "Falta o segredo APT_CHAVE_PRIVADA."; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          echo "$CHAVE" | gpg --batch --import
          bash scripts/repositorio_apt.sh dist site/apt
          gpg --export > site/econt.gpg
          gpg --armor --export > site/econt.asc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicar
        uses: actions/deploy-pages@v4
