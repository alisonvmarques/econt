name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar o Baliza e as ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar o código (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Rodar os testes (pytest)
        run: pytest
